[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "list-django-kit"
version = "1.0.0"
description = "Reusable Django dynamic list, content-type and visual drag-and-drop builder kit matching django-design-studio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[tool.setuptools.packages.find]
include = ["list_kit*"]

[tool.setuptools.package-data]
list_kit = [
    "templates/**/*",
    "static/**/*",
]
