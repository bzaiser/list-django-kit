{% if template.use_cover_image %}
<div class="border rounded-3 p-3 bg-body-tertiary d-flex flex-column gap-2">
    <label class="form-label fw-semibold mb-0"><i class="bi bi-image me-1"></i>Titelbild / Einzelbild</label>
    {% if entry and entry.cover_image %}
    <div class="d-flex align-items-center justify-content-between gap-2 border rounded-2 p-2 bg-body">
        <img src="{{ entry.cover_image.url }}" alt="{{ entry.title }}" class="rounded-2 object-fit-cover" style="width: 72px; height: 52px;">
        <div class="form-check mb-0">
            <input type="checkbox" name="remove_cover_image" value="1" id="rmCover-{{ entry.id }}" class="form-check-input">
            <label class="form-check-label small text-danger" for="rmCover-{{ entry.id }}">Titelbild entfernen</label>
        </div>
    </div>
    {% endif %}
    <input type="file" name="cover_image" accept="image/*" class="form-control form-control-sm">
</div>
{% endif %}
